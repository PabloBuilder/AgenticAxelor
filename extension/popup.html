<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgenticAxelor | Session</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #182321;
        --muted: #5d6d68;
        --line: #d8e0da;
        --surface: #f4f7f3;
        --paper: #ffffff;
        --accent: #087c67;
        --accent-dark: #06624f;
        --ok: #146b45;
        --error: #a3342d;
      }

      * { box-sizing: border-box; }

      body {
        width: 340px;
        margin: 0;
        padding: 18px;
        background: var(--surface);
        color: var(--ink);
        font: 14px/1.45 "Segoe UI Variable", "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .mark {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid #a8cfc4;
        border-radius: 7px;
        color: var(--accent-dark);
        font-size: 16px;
        font-weight: 700;
      }

      .brand {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }

      main { padding-top: 18px; }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .site {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: 19px;
        line-height: 1.25;
      }

      .context {
        min-height: 21px;
        margin: 5px 0 17px;
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      button {
        width: 100%;
        min-height: 42px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover:not(:disabled) { background: var(--accent-dark); }
      button:focus-visible { outline: 3px solid #72b6a6; outline-offset: 2px; }
      button:disabled { cursor: wait; opacity: 0.72; }

      .status {
        min-height: 42px;
        margin: 12px 0 0;
        padding: 10px 11px;
        border-left: 3px solid var(--line);
        background: var(--paper);
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .status[data-state="success"] { border-color: var(--ok); color: var(--ok); }
      .status[data-state="error"] { border-color: var(--error); color: var(--error); }
      .status[data-state="busy"] { border-color: var(--accent); color: var(--ink); }
    </style>
  </head>
  <body>
    <header>
      <div class="mark" aria-hidden="true">A</div>
      <p class="brand">AgenticAxelor</p>
    </header>
    <main>
      <p class="eyebrow">Onglet Axelor actif</p>
      <h1 class="site" id="site-host">Lecture de l’onglet…</h1>
      <p class="context" id="site-context"></p>
      <button id="sync-button" type="button" disabled>Synchroniser la session</button>
      <p class="status" id="sync-status" role="status" aria-live="polite">En attente de l’onglet actif.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
